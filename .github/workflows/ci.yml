name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only database on the throwaway service container. Test setup
      # refuses to reset any database whose name does not end in "_test".
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cs_trainer_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cs_trainer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Creates cs_trainer_test if needed, migrates and runs the mocha suite.
      - run: npm test

      - run: npm run build

      # Migrations must also apply cleanly to a fresh development database,
      # and the deterministic seeds must load.
      - name: Migrate and seed a fresh development database
        run: |
          npm run db:create
          npm run db:reset
          npm run db:review
